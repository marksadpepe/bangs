name: Tests

# Runs on pushes to any branch, on pull requests, and manually.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (macOS)
    # macOS 15+ is needed: Swift Testing ships with Xcode 16+, and /usr/bin/jq ships with macOS 15+.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
          command -v jq

      - name: Run tests
        run: scripts/test.sh

      - name: Build app bundle
        run: scripts/build-app.sh release
